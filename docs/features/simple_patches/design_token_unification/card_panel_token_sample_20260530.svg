<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="shadowLevel1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A0B0D" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 38px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0A0B0D; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B616E; }
      .section { font: 800 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0A0B0D; }
      .label { font: 800 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0A0B0D; }
      .body { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B616E; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5B616E; }
      .monoDark { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #A8ACB3; }
      .darkLabel { font: 800 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .darkBody { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A8ACB3; }
      .chipText { font: 800 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3A6DFF; }
      .small { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B616E; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <text x="72" y="78" class="title">MONEYFY 카드/패널 토큰 샘플</text>
  <text x="72" y="112" class="subtitle">2026-05-30 기준 · SectionCard, AppInnerPanel, AppMetricTile, FloatingMenu, Sheet 표면 규격</text>

  <text x="72" y="168" class="section">공통 토큰</text>
  <rect x="72" y="190" width="1456" height="96" rx="16" fill="#F7F7F7" stroke="#DEE1E6"/>
  <text x="104" y="226" class="mono">radiusCard=16 · radiusSheet=24 · innerRadius(rMd)=12 · sheetTopRadius(rLg)=16 · borderWidth=1</text>
  <text x="104" y="254" class="mono">paddingCard=20 · paddingDense=12 · sectionGap=32 · rowHeight=56 · rowHeightDense=64 · modalBarrierAlpha=0.62</text>

  <text x="72" y="348" class="section">라이트 테마 표면 위계: 기본 섹션 카드 단일 적용</text>

  <rect x="72" y="374" width="444" height="250" rx="16" fill="#F7F7F7" stroke="#DEE1E6" stroke-opacity="0.20"/>
  <text x="104" y="416" class="label">L1 SectionCard 기본</text>
  <text x="104" y="446" class="mono">bg: #F7F7F7 · radius: 16</text>
  <text x="104" y="470" class="mono">border: #DEE1E6 @ 20%</text>
  <rect x="104" y="502" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#DEE1E6" stroke-opacity="0.42"/>
  <text x="128" y="535" class="label">L2 AppInnerPanel.base</text>
  <text x="128" y="561" class="mono">bg: #FFFFFF · radius: 12 · border @ 42%</text>

  <rect x="578" y="374" width="444" height="250" rx="16" fill="#F7F7F7" stroke="#DEE1E6" stroke-opacity="0.20"/>
  <text x="610" y="416" class="label">현재 앱 호출은 모두 기본 카드</text>
  <text x="610" y="446" class="mono">raised / outline API는 호환용으로 유지</text>
  <text x="610" y="470" class="mono">현재 화면 호출부는 base만 사용</text>
  <rect x="610" y="502" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#DEE1E6" stroke-opacity="0.42"/>
  <text x="634" y="535" class="label">L2 내부 패널만 위계 분리</text>
  <text x="634" y="561" class="mono">기본 섹션 안의 보조 정보 영역</text>

  <rect x="1084" y="374" width="444" height="250" rx="16" fill="#F7F7F7" stroke="#DEE1E6" stroke-opacity="0.20"/>
  <text x="1116" y="416" class="label">L3 AppMetricTile</text>
  <text x="1116" y="446" class="mono">bg: #F7F7F7 · radius: 16</text>
  <text x="1116" y="470" class="mono">섹션 카드는 동일, 내부 타일만 별도</text>
  <rect x="1116" y="502" width="380" height="82" rx="12" fill="#EEF0F3" stroke="#DEE1E6" stroke-opacity="0.72"/>
  <text x="1140" y="535" class="label">지표 타일</text>
  <text x="1140" y="561" class="mono">bg: #EEF0F3 · radius: 12 · border @ 72%</text>

  <text x="72" y="690" class="section">부유 표면과 시트</text>

  <rect x="72" y="720" width="444" height="196" rx="16" fill="#FFFFFF" stroke="#DEE1E6" stroke-opacity="0.55" filter="url(#shadowLevel1)"/>
  <text x="104" y="762" class="label">L4 AppFloatingMenuSurface</text>
  <text x="104" y="792" class="mono">bg: #FFFFFF · radius: 16</text>
  <text x="104" y="816" class="mono">border: #DEE1E6 @ 55% · shadow: level1</text>
  <rect x="104" y="848" width="120" height="32" rx="16" fill="#EEF0F3"/>
  <text x="124" y="869" class="chipText">정렬 메뉴</text>

  <path d="M578 744 Q578 720 602 720 H998 Q1022 720 1022 744 V916 H578 Z" fill="#FFFFFF" stroke="#DEE1E6"/>
  <rect x="776" y="746" width="48" height="5" rx="2.5" fill="#DEE1E6"/>
  <text x="610" y="792" class="label">L5 AppSheetSurface</text>
  <text x="610" y="822" class="mono">bg: #FFFFFF · top radius: 16</text>
  <text x="610" y="846" class="mono">handle: width spacing.xl+xs, height 5, rPill</text>

  <rect x="1084" y="720" width="444" height="196" rx="16" fill="#EEF0F3" stroke="#DEE1E6" stroke-opacity="0.30"/>
  <text x="1116" y="762" class="label">표면 색 토큰</text>
  <rect x="1116" y="790" width="54" height="40" rx="8" fill="#FFFFFF" stroke="#DEE1E6"/>
  <text x="1184" y="816" class="mono">surface / inner base #FFFFFF</text>
  <rect x="1116" y="842" width="54" height="40" rx="8" fill="#F7F7F7" stroke="#DEE1E6"/>
  <text x="1184" y="868" class="mono">card base #F7F7F7</text>
  <rect x="1116" y="894" width="54" height="40" rx="8" fill="#EEF0F3" stroke="#DEE1E6"/>
  <text x="1184" y="920" class="mono">raised / metric #EEF0F3</text>

  <text x="72" y="982" class="section">다크 테마 표면 위계</text>
  <rect x="72" y="1008" width="1456" height="140" rx="16" fill="#0A0B0D"/>
  <rect x="104" y="1038" width="330" height="78" rx="16" fill="#16181C" stroke="#16181C"/>
  <text x="128" y="1071" class="darkLabel">L1 base / raised</text>
  <text x="128" y="1098" class="monoDark">bg: #16181C · border: #16181C</text>
  <rect x="466" y="1038" width="330" height="78" rx="12" fill="#16181C" stroke="#16181C"/>
  <text x="490" y="1071" class="darkLabel">L2 inner</text>
  <text x="490" y="1098" class="monoDark">bg: #16181C · radius: 12</text>
  <rect x="828" y="1038" width="330" height="78" rx="16" fill="#16181C" stroke="#16181C" filter="url(#shadowLevel1)"/>
  <text x="852" y="1071" class="darkLabel">L4 overlay</text>
  <text x="852" y="1098" class="monoDark">bg: #16181C · shadow: level1</text>
  <text x="1190" y="1071" class="darkBody">다크는 면 대비보다 텍스트와 간격 위계 중심</text>
  <text x="1190" y="1098" class="monoDark">background: #0A0B0D</text>

  <text x="72" y="1172" class="small">Source: lib/design_system/spec/visual_spec.dart, lib/design_system/tokens.dart, lib/components/section_card.dart, lib/components/panels/*, lib/components/metrics/app_metric_tile.dart</text>
</svg>
